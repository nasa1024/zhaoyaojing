name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build and run SEO QA
        working-directory: web
        run: npm run build
      - name: Test canonical-host Worker
        working-directory: web
        run: npm run test:worker
      - name: Test country performance report
        working-directory: web
        run: npm run test:market-report
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run web regression tests
        working-directory: web
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Git LFS fixtures (videos, most AI images) are missing from the remote,
      # so only run test targets that use non-LFS fixtures. Restore the full
      # `cargo test` (and `cargo test -- --ignored`) once the fixtures are re-pushed.
      - run: cargo test --lib --bins --test audio_detection --test audio_id3
      - run: cargo build --release
