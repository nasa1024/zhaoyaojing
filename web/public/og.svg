<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AICheck365 AI image and video origin detector</title>
  <desc id="desc">Open graph card for AICheck365, a local browser detector for AI media metadata, C2PA, and video frame watermark signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b3b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M80 96h1040v438H80z" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="960" cy="170" r="74" fill="none" stroke="#7dd3fc" stroke-opacity="0.52" stroke-width="18"/>
  <path d="M905 170h110M960 115v110" stroke="#a7f3d0" stroke-width="16" stroke-linecap="round"/>
  <g fill="#ffffff">
    <text x="104" y="158" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">AICheck365</text>
    <text x="104" y="288" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">AI Image/Video</text>
    <text x="104" y="380" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">Origin Detector</text>
  </g>
  <text x="108" y="462" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="500">EXIF · XMP · C2PA · MP4 metadata · frame watermarks</text>
  <g transform="translate(104 506)">
    <rect width="262" height="52" rx="12" fill="url(#accent)"/>
    <text x="26" y="35" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Local. No uploads.</text>
  </g>
</svg>
